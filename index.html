<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Menú de la Semana</title>
<meta name="description" content="Planificación semanal de almuerzos, despensa y lista de compras">
<meta name="theme-color" content="#FAF5EC">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Menú">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="splash">
  <img src="./images/splash.jpg" alt="">
  <div class="sp-txt">
    <div class="sp-name">Menú de la Semana<span class="dot">.</span></div>
    <div class="sp-sub">Almuerzos · Despensa · Compras</div>
    <div class="sp-load">Cargando tu semana…</div>
  </div>
</div>
<div id="v-login">
  <div class="login-card">
    <img src="./icons/icon-192.png" alt="Menú de la Semana">
    <h2>Menú de la Semana</h2>
    <p>Ingresa con tu cuenta para ver y sincronizar el menú, la despensa y la lista de compras.</p>
    <label>Correo</label>
    <input id="login-email" type="email" autocomplete="username" placeholder="correo@ejemplo.com">
    <label>Contraseña</label>
    <input id="login-pass" type="password" autocomplete="current-password" placeholder="Tu contraseña">
    <p class="login-error" id="login-error" style="display:none"></p>
    <button class="btn" id="btn-login">Ingresar</button>
    <button class="login-link" id="login-olvide">Olvidé mi contraseña</button>
  </div>
</div>
<header>
  <h1>Menú de la Semana<span class="dot">.</span></h1>
  <div class="sub">Almuerzos · despensa · compras</div>
</header>
<main>
  <section id="vsem" class="view"><div id="sem"></div></section>
  <section id="vrec" class="view"><div id="rec"></div></section>
  <section id="vdes" class="view"><div id="des"></div></section>
  <section id="vcom" class="view"><div id="com"></div></section>
  <section id="vset" class="view"><div id="set"></div></section>
</main>
<div id="picker" style="display:none"></div>
<nav>
  <button data-v="sem" class="on"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>Semana</button>
  <button data-v="rec"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18l-2.3-1.6-2.4 1.6-2.3-1.6L9.7 21l-2.4-1.6L5 21z"/><path d="M9 8h6M9 12h6"/></svg></span>Recetas</button>
  <button data-v="des"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8h16l-1.5 12a1 1 0 0 1-1 .9h-11a1 1 0 0 1-1-.9L4 8z"/><path d="M8 11V6a4 4 0 0 1 8 0v5"/></svg></span>Despensa</button>
  <button data-v="com"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.6"/><circle cx="17" cy="20" r="1.6"/><path d="M3 3h2l2.4 12h10.4l2.2-9H6"/></svg></span>Compras</button>
  <button data-v="set"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2.2"/><circle cx="9" cy="16" r="2.2"/></svg></span>Ajustes</button>
</nav>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="./app.js"></script>
</body>
</html>
